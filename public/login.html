<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>로그인 · P2P 파일 전송</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container narrow">
    <section class="card">
      <h1>🔒 P2P 파일 전송</h1>
      <p class="sub">초대받은 사람만 사용할 수 있습니다.</p>
      <form id="loginForm" class="join">
        <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required autofocus />
        <button type="submit" class="primary">입장</button>
      </form>
      <p id="error" class="error" hidden></p>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
